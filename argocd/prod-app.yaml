apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zahid-IT/gitops-multi-env-project.git
    targetRevision: main
    path: helm/flask-app
    helm:
      valueFiles:
        - ../../environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
