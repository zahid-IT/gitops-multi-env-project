apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-github>/gitops-multi-env-project.git
    targetRevision: main
    path: helm/flask-app
    helm:
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
